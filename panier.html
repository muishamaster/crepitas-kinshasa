<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panier - Crepitas Kinshasa</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Intégration QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="texture-overlay"></div>

    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <h2>CREPITAS</h2>
                <p>KINSHASA</p>
            </div>
            <div class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <ul class="nav-links">
                <li><a href="./index.html">Accueil</a></li>
                <li><a href="./menu.html">Menu</a></li>
                <!-- <li><a href="./menu-du-jour.html" class="badge-new">Menu du Jour</a></li> -->
                <li><a href="./apropos.html" class="badge-new">À Propos</a></li>
                <li><a href="./faq.html">FAQ</a></li>
                <li><a href="./contact.html">Contact</a></li>
            </ul>
            <div class="nav-actions">
                <button id="themeToggle" class="theme-toggle" aria-label="Basculer le thème" title="Thème sombre/clair"></button>
                <div class="nav-cart">
                    <a href="./panier.html" class="cart-icon" id="cartIcon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <circle cx="9" cy="21" r="1"></circle>
                            <circle cx="20" cy="21" r="1"></circle>
                            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                        </svg>
                        <span class="cart-count" id="cartCount">0</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="main-container">
        <section class="cart-page">
            <h2>Récapitulatif de votre commande</h2>

            <div class="cart-list" id="cart-items">
                <!-- Items rendered by cartManager -->
            </div>

            <div id="orderTypeContainer" class="order-type-container">
                <!-- Order type radio buttons injected by cart-manager.js -->
            </div>

            <div class="cart-summary" id="cartSummary">
                <div class="summary-line"><span>Sous-total</span><span id="subtotal">0 FC</span></div>
                <!-- <div class="summary-line"><span>Frais livraison</span><span id="delivery-fee">1.000 FC</span></div> -->
                <div class="summary-line total"><span>Total</span><span id="total-price">0 FC</span></div>
            </div>

            <div class="cart-actions">
                <!-- <button class="btn-pay" id="paymentBtn" onclick="cartManager.openPaymentModal()">Passer la commande</button> -->
                <button class="btn-whatsapp" onclick="cartManager.sendToWhatsApp()">PASSER LA COMMANDE</button>
            </div>
        </section>
    </main>

    <!-- Section QR Code -->
    <div class="qr-code-section">
        <button class="btn-qr-toggle" onclick="toggleQRCode()">📱 Afficher QR Code Menu</button>
        <div id="qrCodeContainer" class="qr-code-container hidden"></div>
    </div>

    <script src="./src/js/theme-manager.js"></script>
    <script src="./script.js"></script>
    <script src="./src/js/cart-manager.js"></script>
</body>
</html>
